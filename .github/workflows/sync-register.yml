name: Sync register.json

# The Documented Information Register is hardcoded in index.html. This keeps a
# small, machine-readable copy published at /register.json so external tooling
# can read the register without downloading and parsing the whole 700 KB app.
#
# Requires: Settings -> Actions -> General -> Workflow permissions
#           set to "Read and write permissions".

on:
  push:
    branches: [main]
    # register.json is included so that a hand-edited or corrupted copy is
    # repaired on the next push rather than sitting wrong until index.html
    # happens to change. This cannot loop: pushes made with GITHUB_TOKEN do
    # not trigger workflow runs.
    paths:
      - 'index.html'
      - 'register.json'
      - 'tools/extract-register.js'
      - '.github/workflows/sync-register.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-register
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate register.json
        run: node tools/extract-register.js

      - name: Commit if the register changed
        run: |
          # Stage first, then test the index. "git diff" alone compares only
          # tracked files, so a regenerated-from-absent register.json would be
          # untracked and silently skipped.
          # "|| true": with both index.html and register.json absent the
          # pathspec matches nothing and git exits 128, which would fail the
          # job for a state that is correctly a no-op.
          git add -A -- register.json || true
          if git diff --cached --quiet -- register.json; then
            echo "register.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate register.json from index.html"
          # Rebase before pushing: the owner uploads index.html as two commits
          # (delete, then add), so a second push can land while this job runs
          # and a plain push would be rejected non-fast-forward.
          git pull --rebase origin main
          git push
